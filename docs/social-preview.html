<!doctype html>
<html lang="en">
<!--
  GitHub social preview (1280x640). Render with headless Edge/Chrome:

    msedge --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1280,640 \
      --screenshot=docs/social-preview.png \
      file:///<abs path>/docs/social-preview.html

  Then upload docs/social-preview.png in
  GitHub repo Settings -> Social preview.
-->
<head>
  <meta charset="utf-8" />
  <title>rustmd — social preview</title>
  <style>
    :root {
      --accent: #7c8cff;
      --accent-soft: rgba(124, 140, 255, 0.14);
      --ink: #f2f4fb;
      --dim: #a7afc6;
      --faint: #79819a;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 1280px;
      height: 640px;
      margin: 0;
      overflow: hidden;
    }
    body {
      font-family: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(760px 520px at 92% 12%, rgba(79, 109, 245, 0.42), transparent 68%),
        radial-gradient(620px 420px at 4% 104%, rgba(124, 92, 255, 0.24), transparent 70%),
        linear-gradient(135deg, #0a0e18 0%, #0d1220 48%, #111830 100%);
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to right, #000 0%, transparent 62%);
    }
    .copy {
      position: absolute;
      left: 72px;
      top: 84px;
      width: 486px;
    }
    .eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.19em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 22px;
    }
    .brand img {
      width: 66px;
      height: 66px;
      border-radius: 17px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
    .brand h1 {
      margin: 0;
      font-size: 72px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.035em;
    }
    .headline {
      margin: 30px 0 0;
      font-size: 37px;
      line-height: 1.26;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .headline span { color: #b9c3e6; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 30px;
    }
    .chip {
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
      font-size: 14px;
      font-weight: 600;
      color: #dbe1f5;
      white-space: nowrap;
    }
    .chip.accent {
      border-color: rgba(124, 140, 255, 0.5);
      background: var(--accent-soft);
      color: #cdd5ff;
    }
    .meta {
      position: absolute;
      left: 72px;
      bottom: 44px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15px;
      color: var(--faint);
    }
    .meta b { color: var(--dim); font-weight: 600; }
    .meta .dot { width: 4px; height: 4px; border-radius: 50%; background: #3a4160; }
    .shot {
      position: absolute;
      left: 590px;
      top: 114px;
      width: 660px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        0 40px 90px rgba(0, 0, 0, 0.6),
        0 8px 24px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    .shot img { display: block; width: 100%; }
    .glowline {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(124, 140, 255, 0.85), transparent);
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="glowline"></div>

  <div class="copy">
    <div class="eyebrow">Local-first notes app</div>
    <div class="brand">
      <img src="../icons/icon.png" alt="" />
      <h1>rustmd</h1>
    </div>
    <div class="headline">Markdown &amp; HTML notes<br /><span>that stay plain files.</span></div>
    <div class="chips">
      <span class="chip accent">HTML preview in-app</span>
      <span class="chip">CSV · TXT · JSON</span>
      <span class="chip">Offline · no account</span>
      <span class="chip">English / 中文 UI</span>
    </div>
  </div>

  <div class="meta">
    <b>Windows</b> <span class="dot"></span>
    <b>macOS</b> <span class="dot"></span>
    <b>Linux</b>
    <span class="dot"></span>
    Rust + Tauri 2
    <span class="dot"></span>
    Open source (GPL-3.0)
  </div>

  <div class="shot"><img src="screenshots/overview.en.png" alt="rustmd app" /></div>
</body>
</html>
