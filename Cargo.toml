[package]
name = "rustmd"
version = "1.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["River"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Percent-decoding the `rmd` image-protocol URL paths.
percent-encoding = "2"
# Blocking client for fetching remote images during export (rustls: no
# OpenSSL needed on Windows).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.release]
lto = true
strip = true
