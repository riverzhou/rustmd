name: Feature request
description: Suggest a feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        rustmd is intentionally small and local-first: plain files, no account and no
        background sync. Features that keep that constraint are the easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Sketches or examples from other tools are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could an existing feature, a plugin, or an external tool solve this today?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Markdown editing / preview
        - HTML notes / WebView preview
        - CSV / TXT / JSON views
        - Search, folders, tags, vaults
        - Export (HTML / PNG / PDF)
        - Encoding (UTF-8 / GBK / GB18030)
        - UI / i18n / accessibility
        - Performance
        - Packaging / release
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Fit with the project
      options:
        - label: This keeps notes as plain files (no database or proprietary format).
          required: false
        - label: This works offline or degrades gracefully without a network.
          required: false
        - label: I can help test or implement it (optional).
          required: false
