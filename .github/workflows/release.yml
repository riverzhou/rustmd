name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v1.9.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: release quality gate
    # Build and test the release on the latest Ubuntu (26.04), matching
    # LINUX_BUILD.md. Normal CI still runs the gate/E2E on 22.04.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Linux system dependencies
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            curl \
            file \
            xdg-utils \
            xvfb \
            fonts-noto-cjk

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: npm ci

      - name: Check the tag matches every version file
        run: node scripts/check-version.mjs "$RELEASE_TAG"

      - name: Verify release notes and tag/version
        run: node scripts/release-notes.mjs "$RELEASE_TAG" >/dev/null

      - name: Lint, unit tests, repo checks, Rust tests, build
        run: npm run check

      - name: Run end-to-end self-test
        env:
          RUSTMD_SELFTEST: '1'
          RUSTMD_SELFTEST_EXAMPLES: ${{ github.workspace }}/examples
          RUSTMD_SELFTEST_OUT: ${{ github.workspace }}/selftest-artifacts
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        # The report check below is authoritative; a wedged process after a
        # green report must not turn a valid release red (same policy as CI).
        continue-on-error: true
        run: timeout 1200 xvfb-run -a node scripts/launch-dev.mjs

      - name: Verify self-test report
        env:
          RUSTMD_SELFTEST_OUT: ${{ github.workspace }}/selftest-artifacts
        run: node scripts/check-selftest-report.mjs "$RUSTMD_SELFTEST_OUT/report.json" --require-html --require-data

  windows:
    name: windows portable zip
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: npm ci

      - name: Build the release executable
        run: npx tauri build --no-bundle

      - name: Sign the executable
        shell: powershell
        env:
          RUSTMD_WIN_CERT_BASE64: ${{ secrets.RUSTMD_WIN_CERT_BASE64 }}
          RUSTMD_WIN_CERT_PASSWORD: ${{ secrets.RUSTMD_WIN_CERT_PASSWORD }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign-win.ps1

      - name: Verify the executable signature
        shell: powershell
        env:
          RUSTMD_WIN_CERT_BASE64: ${{ secrets.RUSTMD_WIN_CERT_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = Get-AuthenticodeSignature 'target/release/rustmd.exe'
          Write-Host "signature status: $($sig.Status)"
          if ($env:RUSTMD_WIN_CERT_BASE64) {
            # A real Authenticode build must have a fully valid signature,
            # not merely "something other than HashMismatch".
            if ($sig.Status -ne 'Valid') {
              throw "real certificate signed rustmd.exe with status '$($sig.Status)', expected Valid"
            }
          } elseif ($sig.Status -in @('HashMismatch', 'NotSigned')) {
            throw "rustmd.exe is not signed correctly ($($sig.Status))"
          }

      - name: Create and verify the portable zip
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-win-zip.ps1

      - name: List release files
        shell: powershell
        run: Get-ChildItem release -Recurse -File | Select-Object FullName, Length

      - name: Stage flat release assets
        shell: powershell
        run: |
          # A missing zip must fail the job: Copy-Item with an unmatched glob
          # succeeds silently, and the .cer alone would keep artifacts/ non-empty
          # so upload-artifact's if-no-files-found=error would never fire.
          $ErrorActionPreference = 'Stop'
          $version = (node -p "require('./package.json').version").Trim()
          $releaseDir = Join-Path 'release' $version
          New-Item -ItemType Directory -Force artifacts | Out-Null
          # Scope to release/<version>/: the portable folder inside it also
          # contains a copy of the .cer, so a recursive search finds two.
          $zip = @(Get-ChildItem $releaseDir -Filter '*-win-x64-portable.zip' -File)
          if ($zip.Count -ne 1) {
            throw "expected exactly one portable zip under $releaseDir, found $($zip.Count)"
          }
          $zipPath = $zip[0].FullName
          if (-not (Test-Path "$zipPath.sha256")) {
            throw "missing checksum file $zipPath.sha256"
          }
          Copy-Item $zipPath artifacts/
          Copy-Item "$zipPath.sha256" artifacts/
          $cer = @(Get-ChildItem $releaseDir -Filter '*.cer' -File)
          if ($cer.Count -eq 1) {
            $cer | Copy-Item -Destination artifacts/
          } elseif ($cer.Count -gt 1) {
            throw "expected at most one certificate in $releaseDir, found $($cer.Count)"
          } else {
            Write-Host 'No self-signed certificate (real PFX build); skipping'
          }
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: rustmd-windows
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macos arm64 dmg
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Add the Apple Silicon Rust target
        run: rustup target add aarch64-apple-darwin

      - run: npm ci

      - name: Build the Apple Silicon app bundle
        run: npx tauri build --target aarch64-apple-darwin --bundles app

      - name: Ad-hoc sign and verify the app
        # No Apple Developer ID: an ad-hoc signature turns the browser's
        # "app is damaged" error into the normal "cannot verify developer"
        # prompt, which the user can allow in System Settings.
        run: |
          APP="target/aarch64-apple-darwin/release/bundle/macos/rustmd.app"
          test -d "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | head -30
          spctl -a -vv "$APP" 2>&1 || true

      - name: Create the DMG
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          APP="target/aarch64-apple-darwin/release/bundle/macos/rustmd.app"
          DMG="release/rustmd-$VERSION-macos-arm64.dmg"
          STAGE="release/dmg-stage"
          mkdir -p release
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          cp LICENSE "$STAGE/LICENSE"
          cp README.md README.en.md CHANGELOG.md "$STAGE/"
          cp AGENTS.md AUDIT_REPORT.md LINUX_BUILD.md "$STAGE/"
          cp -R docs "$STAGE/docs"
          mkdir -p "$STAGE/.github/workflows"
          cp .github/workflows/*.yml "$STAGE/.github/workflows/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "rustmd" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          rm -rf "$STAGE"
          hdiutil verify "$DMG"
          HASH=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "$HASH  $(basename "$DMG")" | tee "$DMG.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: rustmd-macos
          path: |
            release/*.dmg
            release/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  linux:
    name: linux packages
    needs: verify
    # Release packages are built on the latest Ubuntu (26.04), the baseline
    # documented in LINUX_BUILD.md; the deb/AppImage target Ubuntu 24.04+.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Linux system dependencies
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libfuse2t64 \
            build-essential \
            curl \
            file \
            xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: npm ci

      - name: Build deb + AppImage
        run: npx tauri build --bundles deb,appimage

      - name: Collect packages and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          cp target/release/bundle/deb/*.deb release/
          cp target/release/bundle/appimage/*.AppImage release/
          cd release
          sha256sum *.deb *.AppImage > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v7
        with:
          name: rustmd-linux
          path: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish GitHub Release
    needs: [verify, windows, macos, linux]
    # No build here: only assemble and publish the uploaded artifacts. Pin a
    # stable runner instead of following the ubuntu-latest migration.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Include the repository LICENSE as a release asset
        run: cp LICENSE assets/LICENSE

      - name: Assert every platform asset is present
        run: |
          set -euo pipefail
          for pattern in \
            '*-win-x64-portable.zip' \
            '*-win-x64-portable.zip.sha256' \
            '*-macos-arm64.dmg' \
            '*-macos-arm64.dmg.sha256' \
            '*_amd64.deb' \
            '*_amd64.AppImage' \
            'SHA256SUMS-linux.txt' \
            'LICENSE'; do
            if ! compgen -G "assets/$pattern" > /dev/null; then
              echo "missing release asset: $pattern"
              ls -la assets
              exit 1
            fi
          done

      - name: Combined checksums
        run: |
          set -euo pipefail
          cd assets
          # LICENSE is included; the per-platform .sha256 files and the
          # combined file itself are excluded (self-referential).
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS*' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Render release notes
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > .release-notes.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "rustmd ${{ env.RELEASE_TAG }} — local-first Markdown, HTML & data notes"
          body_path: .release-notes.md
          files: assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
